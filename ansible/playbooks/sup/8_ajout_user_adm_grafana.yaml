---
- name: Configuration des utilisateurs Grafana
  hosts: role_SUP
  remote_user: cloudadm
  gather_facts: no

  vars_files:
    - "./vars/secrets.yml"

  vars:
    grafana_url: "http://localhost:3000"
    grafana_admin_user: "admin"

  tasks:
    - name: Test de l'authentification Admin
      ansible.builtin.uri:
        url: "http://localhost:3000/api/admin/settings"
        user: "admin"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        status_code: 200
      become: yes

    - name: Création des comptes (Identité Serveur)
      community.grafana.grafana_user:
        url: "{{ grafana_url }}"
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        name: "{{ item.name }}"
        email: "{{ item.email }}"
        login: "{{ item.login }}"
        password: "{{ item.password }}"
        is_admin: yes
        state: present
      loop:
        - { name: 'anthony', login: 'anthony', email: "{{ anthony_mail }}", password: "{{ anthony_password }}" }
        - { name: 'lois', login: 'lois', email: "{{ lois_mail }}", password: "{{ lois_password }}" }

    - name: Attribution des droits Admin dans l'organisation
      community.grafana.grafana_organization_user:
        url: "{{ grafana_url }}"
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        org_id: 1
        login: "{{ item }}"
        role: "admin"
        state: present
      loop:
        - anthony
        - lois