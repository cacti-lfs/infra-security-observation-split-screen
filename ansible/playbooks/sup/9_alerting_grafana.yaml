---
- name: Création des règles d'alertes Grafana via API
  hosts: role_SUP
  remote_user: cloudadm
  vars_files:
    - "./vars/secrets.yml"

  tasks:
    # 1. On récupère les nouveaux UIDs pour corriger les alertes à la volée
    - name: Récupérer l'UID InfluxDB-Trix
      ansible.builtin.uri:
        url: "http://localhost:3000/api/datasources/name/InfluxDB-Trix"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
      register: influx_ds

    - name: Lire et corriger le JSON des alertes
      ansible.builtin.set_fact:
        # On remplace l'ancien UID par le nouveau directement dans le texte du JSON
        alert_content: "{{ lookup('file', 'templates/split_screen_alerts.json') | replace('dfbg4ka7l88w0a', influx_ds.json.uid) }}"

    - name: Parser le contenu corrigé
      ansible.builtin.set_fact:
        alert_data: "{{ alert_content | from_json }}"

    - name: 1. Créer ou valider le dossier SUPERVISION
      ansible.builtin.uri:
        url: "http://localhost:3000/api/folders"
        method: POST
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          uid: "sup_folder_001"
          title: "SUPERVISION"
        # Ajout du 412 pour éviter l'échec si le dossier est déjà là
        status_code: [200, 201, 409, 412]

    - name: 2. Injecter les alertes dans le dossier SUPERVISION (POST)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/provisioning/alert-rules"
        method: POST
        user: "{{ grafana_admin_user }}" 
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          uid: "{{ item.uid }}"
          title: "{{ item.title }}"
          condition: "{{ item.condition }}"
          data: "{{ item.data }}"
          annotations: "{{ item.annotations }}"
          noDataState: "{{ item.noDataState }}"
          execErrState: "{{ item.execErrState }}"
          for: "{{ item.for }}"
          ruleGroup: "TrixGroup"
          folderUID: "sup_folder_001"
        # 201 = Créé, 400/409/412 = Déjà existant ou erreur de validation
        status_code: [201, 400, 409, 412]
      loop: "{{ alert_data.groups[0].rules }}"
      register: post_alerts

    # Si le POST a échoué car l'alerte existe, on tente le PUT pour mettre à jour
    - name: 3. Mettre à jour les alertes existantes (PUT)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/provisioning/alert-rules/{{ item.item.uid }}"
        method: PUT
        user: "{{ grafana_admin_user }}" 
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          uid: "{{ item.item.uid }}"
          title: "{{ item.item.title }}"
          condition: "{{ item.item.condition }}"
          data: "{{ item.item.data }}"
          annotations: "{{ item.item.annotations }}"
          noDataState: "{{ item.item.noDataState }}"
          execErrState: "{{ item.item.execErrState }}"
          for: "{{ item.item.for }}"
          ruleGroup: "TrixGroup"
          folderUID: "sup_folder_001"
        status_code: [200, 204]
      loop: "{{ post_alerts.results }}"
      when: item.status == 400 or item.status == 409