---
- name: Création des règles d'alertes Grafana via API
  hosts: role_SUP
  remote_user: cloudadm
  vars_files:
    - "./vars/secrets.yml"

  tasks:
    - name: Récupérer l'UID InfluxDB-Trix
      ansible.builtin.uri:
        url: "http://localhost:3000/api/datasources/name/InfluxDB-Trix"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
      register: influx_ds

    - name: Lire et corriger le JSON des alertes
      ansible.builtin.set_fact:
        alert_content: "{{ lookup('file', 'templates/split_screen_alerts.json') | replace('dfbg4ka7l88w0a', influx_ds.json.uid) }}"

    - name: Parser le contenu
      ansible.builtin.set_fact:
        alert_data: "{{ alert_content | from_json }}"

    - name: Autoriser l'édition des alertes provisionnées dans grafana.ini
      ansible.builtin.lineinfile:
        path: /etc/grafana/grafana.ini
        regexp: '^;?allow_ui_updates ='
        line: 'allow_ui_updates = true'
      become: true
      register: graf_config

    - name: Redémarrer Grafana si nécessaire
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
      become: true
      when: graf_config.changed

    - name: 1. Créer le dossier SUPERVISION
      ansible.builtin.uri:
        url: "http://localhost:3000/api/folders"
        method: POST
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          uid: "sup_folder_001"
          title: "SUPERVISION"
        status_code: [200, 201, 409, 412]

    - name: 1b. Forcer les permissions Admin pour déverrouiller l'UI
      ansible.builtin.uri:
        url: "http://localhost:3000/api/folders/sup_folder_001/permissions"
        method: POST
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          items:
            - role: "Admin"
              permission: 4 
            - role: "Editor"
              permission: 2
        status_code: [200, 201, 207]

    - name: 2. Injecter les alertes en mode LIBRE (Edit autorisé)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/provisioning/alert-rules"
        method: POST
        user: "{{ grafana_admin_user }}" 
        password: "{{ grafana_admin_password }}"
        force_basic_auth: yes
        body_format: json
        headers:
          X-Disable-Provenance: "true" # Indispensable pour l'UI
        body:
          uid: "{{ item.uid }}"
          title: "{{ item.title }}"
          condition: "{{ item.condition }}"
          data: "{{ item.data }}"
          annotations: "{{ item.annotations }}"
          noDataState: "{{ item.noDataState }}"
          execErrState: "{{ item.execErrState }}"
          for: "{{ item.for }}"
          ruleGroup: "TrixGroup"
          folderUID: "sup_folder_001"
          provenance: "" # Force la provenance à VIDE pour l'UI
        status_code: [200, 201, 400, 409]
      loop: "{{ alert_data.groups[0].rules }}"