---
- name: Installation de Grafana (VM Supervision)
  hosts: role_SUP
  remote_user: cloudadm
  gather_facts: yes

  vars_files: 
    - "./vars/secrets.yml"

  tasks:
    - name: Nettoyage complet des résidus Apt Grafana
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/grafana.list
        - /etc/apt/sources.list.d/grafana.sources
      become: yes

    - name: Purge du cache Apt corrompu
      command: apt-get clean
      become: yes

    - name: Installation de gnupg et wget
      apt:
        name: [gnupg, wget]
        state: present
        update_cache: yes
      become: yes

    - name: Création du dossier keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: yes

    - name: Installation de la clé GPG (méthode de-armored)
      shell: |
        wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg
      become: yes

    - name: Ajout du dépôt Grafana (Format Moderne)
      copy:
        dest: /etc/apt/sources.list.d/grafana.sources
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.gpg
      become: yes

    - name: Installation de Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes
      become: yes



    - name: Configuration SMTP Grafana (Section [smtp] uniquement)
      ini_file:
        path: /etc/grafana/grafana.ini
        section: smtp
        option: "{{ item.opt }}"
        value: "{{ item.val }}"
      loop:
        - { opt: 'enabled', val: 'true' }
        - { opt: 'host', val: 'smtp.gmail.com:587' }
        - { opt: 'user', val: 'anthonyboulinguiez.09@gmail.com' }
        - { opt: 'password', val: "{{ mdp_alerte_mail }}" }
        - { opt: 'skip_verify', val: 'true' }
        - { opt: 'from_address', val: 'anthonyboulinguiez.09@gmail.com' }
        - { opt: 'from_name', val: 'Grafana Trix' }
      become: yes
      notify: Restart Grafana

    - name: Start Grafana
      service:
        name: grafana-server
        state: started
        enabled: yes
      become: yes

  handlers:
    - name: Restart Grafana
      service:
        name: grafana-server
        state: restarted
      become: yes

      
