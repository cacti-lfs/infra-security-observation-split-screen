---
- name: Installation de Grafana (VM Supervision)
  hosts: role_SUP
  remote_user: cloudadm
  gather_facts: yes

  tasks:
    - name: Installation de gnupg et wget
      apt:
        name: 
          - gnupg
          - wget
        state: present
        update_cache: yes
      become: yes

    - name: Création du dossier pour les clés
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: yes

    - name: Téléchargement et installation de la clé GPG Grafana
      shell: |
        wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor > /etc/apt/keyrings/grafana.gpg
      become: yes
      args:
        creates: /etc/apt/keyrings/grafana.gpg

    - name: Ajout du dépôt Grafana
      copy:
        dest: /etc/apt/sources.list.d/grafana.sources
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.gpg
      become: yes

    - name: Installation de Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes
      become: yes

    - name: Démarrage de Grafana
      service:
        name: grafana-server
        state: started
        enabled: yes
      become: yes