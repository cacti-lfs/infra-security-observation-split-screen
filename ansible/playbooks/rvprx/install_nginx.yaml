---
- name: Configuration du Reverse Proxy Nginx
  hosts: role_RVPRX
  remote_user: cloudadm
  gather_facts: yes 
  
  tasks:
    - name: Mise à jour du cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Installation de Nginx
      apt:
        name: nginx
        state: present
      become: yes

    - name: S'assurer que Nginx est démarré et activé au boot
      service:
        name: nginx
        state: started
        enabled: yes
      become: yes

    - name: Création d'une page d'accueil personnalisée
      copy:
        content: "<h1>Bienvenue sur le Reverse Proxy de SPLIT SCREEN</h1>"
        dest: /var/www/html/index.html
        mode: '0644'
      become: yes