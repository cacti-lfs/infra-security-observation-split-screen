---
- name: Installation et Configuration de Promtail (Mode Journal)
  hosts: role_ALL
  remote_user: cloudadm
  gather_facts: yes

  tasks: 
    - name: Installation des paquets de base
      become: yes
      apt:
        name: [wget, gnupg, apt-transport-https]
        state: present
        update_cache: yes
    
    - name: Installation de la clé GPG Grafana
      become: yes
      shell: |
        mkdir -p /etc/apt/keyrings
        wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg

    - name: Ajout du dépôt Grafana
      become: yes
      copy:
        dest: /etc/apt/sources.list.d/grafana.sources
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.gpg

    - name: Installation de Promtail
      become: yes
      apt:
        name: promtail
        state: present
        update_cache: yes

    - name: Autoriser Promtail à lire le Journal (Groupe adm)
      become: yes
      user:
        name: promtail
        groups: 
          - adm
          - systemd-journal
        append: yes

    - name: Configuration de Promtail (Scraping Journal)
      become: yes
      copy:
        dest: /etc/promtail/config.yml
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/positions.yaml

          clients:
            - url: http://{{ hostvars[groups['role_SUP'][0]]['ansible_host'] }}:3100/loki/api/v1/push

          scrape_configs:
          - job_name: journal
            journal:
              max_age: 12h
              labels:
                job: systemd-journal
                host: "{{ inventory_hostname }}"
            relabel_configs:
              - source_labels: ['__journal__systemd_unit']
                target_label: 'unit'
      notify: Restart Promtail

    - name: Démarrage et activation de Promtail
      become: yes
      service: 
        name: promtail
        state: started
        enabled: yes

  handlers:
    - name: Restart Promtail
      become: yes
      service:
        name: promtail
        state: restarted