---
- name: Configuration appli web
  hosts: role_APPLI
  remote_user: cloudadm
  gather_facts: yes
  vars:
    app_dir: /srv/
    app_user: www-data
    app_group: www-data
  tasks:
    - name: Installation python3
      apt:
        name: 
          - python3-pip
          - python3-venv
          - python3-full
        state: present
        update_cache: yes
      become: yes

    - name: Installation Gunicorn
      pip:
        name:
          - flask
          - gunicorn
        virtualenv: /home/cloudadm/app_venv
        virtualenv_command: python3 -m venv

    - name: Creation du répertoire
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      become: yes
    
    - name: Deployement code python
      copy:
        dest: "{{ app_dir }}/app.py"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
        content: |
          from flask import Flask, jsonify
          from datetime import datetime

          app = Flask(__name__)

          @app.route('/')
          def index():
              now = datetime.now().strftime("%H:%M:%S")
              return f"<h1>Heure actuelle (via Ansible) : {now}</h1>"

          @app.route('/health')
          def health():
              return jsonify(status="UP", method="Ansible", timestamp=datetime.now().isoformat()), 200

          if __name__ == "__main__":
              app.run(host='0.0.0.0')
      become: yes
      notify: Restart TimeApp