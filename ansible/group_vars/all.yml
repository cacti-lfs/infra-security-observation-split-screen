ansible_user: cloudadm
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

## Configuration du rebond SSH
ansible_ssh_common_args: >
  {% if inventory_hostname != '01-SRV-BAST-TRIX' %}
  -o ProxyJump=cloudadm@{{ hostvars[groups['role_BAST'][0]]['ansible_host'] }}
  {% endif %}

