plugin: community.proxmox.proxmox
# Credentials dans le setup_env.sh
validate_certs: false
want_facts: true

# Mapping de l'IP via l'agent
compose:
  ansible_host: proxmox_agent_interfaces[1].ip-addresses[0].split('/')[0]

keyed_groups:
  # On utilise 'proxmox_name' qui est la variable standard injectée par le plugin
  - prefix: role
    key: proxmox_name.split('-')[2]
    separator: "_"